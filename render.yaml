services:
  - type: web
    name: urbanbasket-backend
    runtime: node
    plan: free
    region: oregon
    rootDir: .
    buildCommand: npm install --include=dev && npm --workspace=backend run prisma:generate && npm --workspace=backend run build
    startCommand: npm --workspace=backend run start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: FRONTEND_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: NEON_AUTH_URL
        value: https://ep-shiny-bonus-bi8xa84c.neonauth.c-5.ap-southeast-1.aws.neon.tech/neondb/auth
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      - key: PAYMENT_PROVIDER
        value: stripe
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
