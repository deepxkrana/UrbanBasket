name: CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend-checks:
    name: Backend Lint, Build & Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - name: Install root & backend dependencies
        run: npm ci --workspace=backend
      - name: Generate Prisma Client
        run: npm --workspace=backend run prisma:generate
      - name: Build Backend
        run: npm --workspace=backend run build
      - name: Run Backend Tests
        run: npm --workspace=backend test

  frontend-checks:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - name: Install root & frontend dependencies
        run: npm ci --workspace=frontend
      - name: Build Frontend
        run: npm --workspace=frontend run build
